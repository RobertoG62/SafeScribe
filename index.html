<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale and user-scalable=no removed: they blocked pinch zoom entirely -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScribe V5.1 Sound</title>
    <!-- Built stylesheet in place of the Tailwind play CDN, which is a
         development tool and fetched a script from a third party each load. -->
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/fontawesome.min.css">
    <!-- Fonts and icons are served from this site. They used to come from
         Google and cdnjs, so every visit disclosed the visitor's IP to two
         third parties before anything happened on the page. -->
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        body { font-family: 'Rubik', sans-serif; }
        
        .pulse-ring { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        
        .lang-btn.active { background-color: #e0e7ff; border-color: #6366f1; color: #4338ca; transform: scale(1.05); }
    </style>
</head>
<!-- Page scrolls instead of being locked to screen height: the policy footer
         squeezed the history panel (and its TXT button) down to a thin line. -->
<body class="bg-slate-50 text-gray-800 flex flex-col" style="min-height:100vh">

    <header class="bg-slate-900 text-white p-3 shadow-lg flex-shrink-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-globe-americas text-teal-400 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wide">SafeScribe <span class="text-[10px] bg-purple-600 px-1.5 py-0.5 rounded ml-1 align-middle">V5.1 SOUND</span></h1>
            </div>
            <button onclick="newMeeting()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded border border-slate-600 transition flex items-center gap-2">
                <i class="fas fa-file-circle-plus"></i> חדש
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col container mx-auto p-2 sm:p-4 max-w-4xl min-h-0 gap-3">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex-shrink-0 z-40">
            
            <div class="flex flex-col items-center mb-2">
                <div id="statusBadge" class="px-4 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-600 mb-4 transition-all duration-300">
                    מוכן להקלטה
                </div>

                <div class="relative mb-4">
                    <button id="mainBtn" onclick="toggleRecording()" aria-label="התחל או עצור הקלטה" class="relative z-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full w-20 h-20 flex items-center justify-center text-3xl shadow-xl transition-all duration-300 transform hover:scale-105 active:scale-95">
                        <i class="fas fa-microphone" id="btnIcon"></i>
                    </button>
                    <div id="pulseRing" class="absolute inset-0 rounded-full bg-red-500 opacity-0 transition-opacity duration-300"></div>
                </div>

                <div class="flex bg-gray-100 p-1 rounded-lg gap-1 mb-2">
                    <button onclick="changeLang('he-IL')" id="btnHe" class="lang-btn active px-4 py-1.5 rounded-md text-sm font-medium text-gray-600 border border-transparent transition-all flex items-center gap-2">
                        <span>🇮🇱</span> עברית
                    </button>
                    <button onclick="changeLang('en-US')" id="btnEn" class="lang-btn px-4 py-1.5 rounded-md text-sm font-medium text-gray-600 border border-transparent transition-all flex items-center gap-2">
                        <span>🇺🇸</span> English
                    </button>
                </div>
                <p class="text-[10px] text-gray-600">צפצוף יישמע בתחילת הקלטה</p>
            </div>

            <div class="bg-indigo-50 rounded-lg p-3 border border-indigo-100 min-h-[50px] flex flex-col justify-center">
                <span class="text-[10px] text-indigo-700 font-bold uppercase tracking-wider mb-1 flex justify-between">
                    <span><i class="fas fa-bolt"></i> זיהוי חי</span>
                    <span id="currentLangDisplay" class="text-indigo-700">HE</span>
                </span>
                <p id="interimText" class="text-indigo-900 font-medium text-lg leading-tight min-h-[1.5rem]">...</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-grow flex flex-col relative overflow-hidden" style="height:60vh;min-height:280px">
            <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
                <span class="text-xs font-bold text-gray-500"><i class="fas fa-check-double text-green-500"></i> היסטוריה</span>
                <div class="flex gap-2">
                    <button onclick="exportTxt()" class="text-xs bg-white border border-gray-300 hover:bg-gray-50 px-2 py-1 rounded text-gray-700">
                        <i class="fas fa-download"></i> TXT
                    </button>
                </div>
            </div>
            
            <div id="transcriptContainer" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar scroll-smooth bg-white">
                <div id="emptyState" class="flex flex-col items-center justify-center h-full text-gray-500">
                    <i class="fas fa-language text-5xl mb-4"></i>
                    <p class="text-sm">התחל להקליט בעברית או באנגלית</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let recognition;
        let isRecording = false;
        let transcriptData = [];
        let wakeLock = null;
        let currentLang = 'he-IL';

        const mainBtn = document.getElementById('mainBtn');
        const btnIcon = document.getElementById('btnIcon');
        const statusBadge = document.getElementById('statusBadge');
        const pulseRing = document.getElementById('pulseRing');
        const interimDisplay = document.getElementById('interimText');
        const container = document.getElementById('transcriptContainer');
        const langDisplay = document.getElementById('currentLangDisplay');

        function initRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = currentLang;

                recognition.onstart = () => {
                    isRecording = true;
                    updateStatus('recording');
                    requestWakeLock();
                    playFeedbackTone(600, 150); // צפצוף התחלה (גבוה)
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            addTranscriptEntry(event.results[i][0].transcript);
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    if(interimTranscript) {
                        interimDisplay.innerText = interimTranscript;
                        interimDisplay.style.opacity = "1";
                        interimDisplay.style.direction = currentLang === 'he-IL' ? 'rtl' : 'ltr';
                    }
                };

                recognition.onend = () => {
                    if (isRecording) {
                        recognition.start(); 
                    } else {
                        updateStatus('idle');
                        releaseWakeLock();
                    }
                };
                
                // Errors that will repeat on every retry: stop and say why, instead of
                // restarting forever while the button shows "recording".
                // Chromium forks such as Comet or Brave lack Google's speech key and fail with 'network'.
                // https://developer.mozilla.org/docs/Web/API/SpeechRecognitionErrorEvent/error
                const fatalErrors = {
                    'not-allowed': "אין גישה למיקרופון. אשר גישה למיקרופון בהגדרות הדפדפן.",
                    'service-not-allowed': "הדפדפן הזה לא תומך בזיהוי דיבור. פתח את האתר ב-Chrome או ב-Edge.",
                    'network': "אין חיבור לשירות זיהוי הדיבור. אם יש אינטרנט, הדפדפן כנראה לא תומך — פתח ב-Chrome או ב-Edge.",
                    'audio-capture': "לא נמצא מיקרופון. בדוק שהמיקרופון מחובר.",
                    'language-not-supported': "השפה שנבחרה לא נתמכת בדפדפן הזה."
                };

                recognition.onerror = (event) => {
                    console.error("Error:", event.error);
                    const message = fatalErrors[event.error];
                    if (!message) return;
                    isRecording = false;
                    updateStatus('idle');
                    alert(message);
                };
            } else {
                alert("דפדפן לא נתמך. חובה Chrome.");
            }
        }

        initRecognition();

        function changeLang(lang) {
            if (currentLang === lang) return;
            currentLang = lang;
            document.getElementById('btnHe').classList.toggle('active', lang === 'he-IL');
            document.getElementById('btnEn').classList.toggle('active', lang === 'en-US');
            langDisplay.innerText = lang === 'he-IL' ? 'HE' : 'EN';

            if (isRecording) {
                recognition.stop(); 
                interimDisplay.innerText = "מחליף שפה...";
                recognition.lang = currentLang;
            } else {
                recognition.lang = lang;
            }
        }

        function toggleRecording() {
            if (!recognition) return;

            if (!isRecording) {
                updateStatus('connecting');
                try { recognition.start(); } catch (e) { console.error(e); }
            } else {
                updateStatus('processing');
                setTimeout(() => {
                    isRecording = false;
                    recognition.stop();
                    interimDisplay.innerText = "...";
                    playFeedbackTone(300, 150); // צפצוף עצירה (נמוך)
                }, 800);
            }
        }

        function updateStatus(state) {
            mainBtn.className = "relative z-10 rounded-full w-20 h-20 flex items-center justify-center text-3xl shadow-xl transition-all duration-300 transform hover:scale-105 active:scale-95 text-white";
            pulseRing.className = "absolute inset-0 rounded-full opacity-0";
            
            switch(state) {
                case 'idle':
                    mainBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    btnIcon.className = "fas fa-microphone";
                    statusBadge.innerText = "מוכן להקלטה";
                    statusBadge.className = "px-4 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-600 mb-4";
                    break;
                case 'connecting':
                    mainBtn.classList.add('bg-yellow-500');
                    btnIcon.className = "fas fa-spinner fa-spin";
                    statusBadge.innerText = "טוען...";
                    break;
                case 'recording':
                    mainBtn.classList.add('bg-red-500');
                    btnIcon.className = "fas fa-stop";
                    pulseRing.classList.add('pulse-ring');
                    statusBadge.innerHTML = `<span class="flex items-center gap-2"><i class="fas fa-circle text-[10px] animate-pulse"></i> מקליט (${currentLang === 'he-IL' ? 'עברית' : 'אנגלית'})</span>`;
                    statusBadge.className = "px-4 py-1 rounded-full text-sm font-medium bg-red-50 text-red-600 border border-red-100 mb-4";
                    break;
                case 'processing':
                    mainBtn.classList.add('bg-gray-400');
                    btnIcon.className = "fas fa-save";
                    statusBadge.innerText = "שומר...";
                    break;
            }
        }

        function addTranscriptEntry(text) {
            if (!text.trim()) return;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
            transcriptData.push({ time: timeStr, text: text });
            renderEntry(timeStr, text);
            saveToLocal();
            interimDisplay.innerText = "...";
        }

        function renderEntry(timeStr, text) {
            const isEnglish = /^[A-Za-z0-9\s.,?!]*$/.test(text);
            const direction = isEnglish ? 'ltr' : 'rtl';
            const align = isEnglish ? 'text-left' : 'text-right';
            const flag = currentLang === 'he-IL' ? '' : '<span class="mr-1">🇺🇸</span>';

            if(document.getElementById('emptyState')) container.innerHTML = '';

            const div = document.createElement('div');
            div.className = `bg-white p-3 rounded border-r-4 ${currentLang === 'he-IL' ? 'border-teal-500' : 'border-indigo-500'} shadow-sm ${align} animate-[fadeIn_0.3s_ease-out]`;
            div.style.direction = direction;
            div.innerHTML = `<span class="text-xs text-gray-400 block mb-1 font-mono flex justify-between">${timeStr} ${flag}</span><p class="text-gray-800 text-lg leading-relaxed">${text}</p>`;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function exportTxt() {
            if (transcriptData.length === 0) { alert("אין תוכן"); return; }
            let content = "SafeScribe V5 Transcript\n========================\n\n";
            transcriptData.forEach(i => content += `[${i.time}] ${i.text}\n`);
            downloadFile(content);
        }

        function downloadFile(content) {
            const date = new Date().toISOString().slice(0,16).replace(/[:T]/g, '-');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SafeScribe_${date}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function newMeeting() {
            if(transcriptData.length > 0 && !confirm("למחוק הכל?")) return;
            transcriptData = [];
            localStorage.removeItem('safeScribeV5');
            location.reload();
        }

        function saveToLocal() { localStorage.setItem('safeScribeV5', JSON.stringify(transcriptData)); }
        
        // Earlier versions re-saved the history on every page load, doubling it
        // each time until the tab ran out of memory. Collapse it back to one copy.
        function dropRepeats(data) {
            for (let p = 1; p < data.length; p++) {
                if (data.every((item, i) => item.text === data[i % p].text)) return data.slice(0, p);
            }
            return data;
        }

        const saved = localStorage.getItem('safeScribeV5');
        if(saved) {
            transcriptData = dropRepeats(JSON.parse(saved));
            saveToLocal();
            transcriptData.forEach(i => renderEntry(i.time, i.text));
        }

        async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
        function releaseWakeLock() { if (wakeLock) wakeLock.release().then(() => wakeLock = null); }
        
        // פונקציית הסאונד ששכחנו
        function playFeedbackTone(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.value = 0.1;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), duration);
            } catch(e) { console.log("Audio context blocked by browser policy"); }
        }
    </script>
<style>
.policy-links{padding:18px 20px 26px;text-align:center;font-size:.8rem;line-height:1.85;color:#475569;border-top:1px solid #e2e8f0;background:#f8fafc}
.policy-links p{margin:0 0 6px;max-width:62ch;margin-inline:auto}
.policy-links a{color:#4338ca;text-decoration:underline}
</style>
<footer class="policy-links">
  <p><b>התמלול מתבצע בשירות זיהוי הדיבור של הדפדפן — הקול משודר לשרתי Google.</b> ראו <a href="privacy.html">מדיניות פרטיות</a>.</p>

</footer>
</body>
</html>
